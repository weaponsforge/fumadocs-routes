name: Bug Report
description: Create a bug report
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue:

        - Do a search of existing issues.
        - Pull the latest updates from this repository's `dev` branch.

  - type: textarea
    attributes:
      label: To Reproduce
      description: A step-by-step description of how to reproduce the issue, or a link to the reproducible repository.
      placeholder: |
        1. Start the application in development (npm run routes:generate)
        2. Press enter
        3. A warning appears: "[routes:generate] warning: content/docs not found, writing empty route lists"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: A clear and concise description of what the bug is, and what you expected to happen.
      placeholder: 'Following the steps from the previous section, I expected A to happen, but I observed B instead'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Provide environment information
      description: Please run `npm run info` in the root directory of your project and paste the results.
      render: bash
      placeholder: |
        App version: 1.1.4
        Node version: v24.11.0
        Platform: win32
        Arch: x64
        V8 version: 13.6.233.10-node.28
        npm version: 11.6.1
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Which area(s) are affected? (Select all that apply)
      multiple: true
      options:
        - 'Not sure'
        - 'CLI usage'
        - 'Library code'
        - 'JSON output'
        - 'Docker image'
        - 'Others'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: |
        Any extra information that might help us investigate.
      placeholder: |
        I tested my reproduction against different `fumadocs-routes` releases, and the first one that introduced the bug was "v1.1.3", since reverting to "v1.1.2" works.
